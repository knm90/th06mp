; th06mp - co-op settings. Read once when the game starts.

[th06mp]
; Number of players, 1-4. 1 leaves the game completely unmodified.
players=2

; How player 1 is controlled:
;   auto     - like "game" when there are enough controllers for everyone,
;              otherwise like "keyboard" so the controllers go to players 2-4
;   game     - the game's own input (keyboard + first controller)
;   keyboard - keyboard only, using the keys in [p1]
p1_input=auto

; 1 = colour players 2-4 so you can tell them apart, 0 = no tint
tint=1

; Who enemies aim at:
;   rotate - each enemy picks a living player, changing every target_period frames
;   p1     - always player 1 (original behaviour)
target=rotate
target_period=180

; 1 = write every player's position and state changes to th06mp.log
debug=0

[net]
; Network play. One machine hosts and is player 1; the others join and become
; players 2-4 in the order they connect. Everyone launches through th06mp.exe;
; the game waits at start-up until all players are connected (Esc: play offline).
;   mode    = off | host | join
;   address = the host's IP address or name (join only)
;   port    = TCP port; the host must be reachable on it
;   delay   = frames between pressing a button and it taking effect (host's
;             value is used); raise it if the game stutters over the internet
; The host's players, character, shot_type and target settings apply to all.
; Each player uses their own machine's normal player-1 controls. Both games
; must have the same lives and bombs set in the game's Options.
mode=off
address=127.0.0.1
port=17606
delay=3

; --- per-player settings ------------------------------------------------------
; character = same | other | reimu | marisa
; shot_type = same | other | a | b
;        Character and shot type for players 2-4. "same" and "other" are
;        relative to what player 1 picks in the game's menu; the rest are
;        fixed. The defaults give four different combinations.
; pad  = auto | none | 0-3 (XInput controller slot)
; keys = a letter or digit, or one of: UP DOWN LEFT RIGHT LSHIFT RSHIFT LCTRL RCTRL
;        LALT RALT SPACE ENTER TAB COMMA PERIOD SLASH SEMICOLON NUM0-NUM9 NONE,
;        or a virtual-key code such as 0x41
; tint = RRGGBB
; Controller layout: stick/d-pad move, A shot, B/Y bomb, X/LB/RB/triggers focus.
;
; The game gives player 1 two keyboard layouts: arrows + Z/X/LShift and
; WASD + J/K/L. During co-op, any key bound to players 2-4 below is taken away
; from player 1, so with the defaults player 1 keeps the arrow-key layout.

[p1]
; Only used when p1_input ends up as "keyboard". Must match the game's keys.
up=UP
down=DOWN
left=LEFT
right=RIGHT
shot=Z
bomb=X
focus=LSHIFT

[p2]
character=other
shot_type=same
pad=auto
up=W
down=S
left=A
right=D
shot=J
bomb=K
focus=L
tint=A8D4FF

[p3]
character=same
shot_type=other
pad=auto
tint=FFD8A0

[p4]
character=other
shot_type=other
pad=auto
tint=B0FFB0
